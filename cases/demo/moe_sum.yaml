# MoE Sum算子测试用例
# 将topk个expert输出求和

definition_name: moe_sum
operator: moe_sum
library: flaggems_vllm

const_axes:
  topk: 8
  hidden_size: 7168

workloads:
  - name: "deepseek_decode_batch1"
    source: "DeepSeek-V3, MoE层, decode, batch=1"
    var_axes:
      num_tokens: 1
    dtype: bfloat16

  - name: "deepseek_decode_batch32"
    source: "DeepSeek-V3, MoE层, decode, batch=32"
    var_axes:
      num_tokens: 32
    dtype: bfloat16

  - name: "deepseek_decode_batch128"
    source: "DeepSeek-V3, MoE层, decode, batch=128"
    var_axes:
      num_tokens: 128
    dtype: bfloat16

  - name: "deepseek_prefill_seq1024"
    source: "DeepSeek-V3, MoE层, prefill, seq=1024"
    var_axes:
      num_tokens: 1024
    dtype: bfloat16
