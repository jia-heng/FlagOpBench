operator: mm
description: "Matrix Multiply (GEMM) - FlashInfer Real Workloads"

definition:
  const_axes:
    dtype: "bf16"
  var_axes:
    M: [1, 8, 64, 256, 1024, 4096]
    N: [128, 256, 2048, 4096, 5120, 6144, 14336, 28672]
    K: [2048, 4096, 7168, 14336]

workloads:
  # 来自 FlashInfer: gemm_n128_k2048.json (Qwen3-30B-A3B moe.gate)
  - name: qwen3_30b_moe_gate_decode
    phase: decode
    M: 1
    N: 128
    K: 2048
    source: "flashinfer-trace/gemm_n128_k2048 (Qwen3-30B-A3B moe.gate)"

  - name: qwen3_30b_moe_gate_prefill
    phase: prefill
    M: 256
    N: 128
    K: 2048
    source: "flashinfer-trace/gemm_n128_k2048 (Qwen3-30B-A3B moe.gate)"

  # 来自 FlashInfer: gemm_n4096_k4096.json (Llama-3.1-8B attn.o_proj)
  - name: llama31_8b_o_proj_decode
    phase: decode
    M: 1
    N: 4096
    K: 4096
    source: "flashinfer-trace/gemm_n4096_k4096 (Llama-3.1-8B attn.o_proj)"

  - name: llama31_8b_o_proj_prefill_256
    phase: prefill
    M: 256
    N: 4096
    K: 4096
    source: "flashinfer-trace/gemm_n4096_k4096 (Llama-3.1-8B attn.o_proj)"

  - name: llama31_8b_o_proj_prefill_1024
    phase: prefill
    M: 1024
    N: 4096
    K: 4096
    source: "flashinfer-trace/gemm_n4096_k4096 (Llama-3.1-8B attn.o_proj)"

  # 来自 FlashInfer: gemm_n4096_k14336.json (Llama-3.1-8B ffn.down_proj)
  - name: llama31_8b_ffn_down_decode
    phase: decode
    M: 1
    N: 4096
    K: 14336
    source: "flashinfer-trace/gemm_n4096_k14336 (Llama-3.1-8B ffn.down_proj)"

  - name: llama31_8b_ffn_down_prefill_256
    phase: prefill
    M: 256
    N: 4096
    K: 14336
    source: "flashinfer-trace/gemm_n4096_k14336 (Llama-3.1-8B ffn.down_proj)"

  - name: llama31_8b_ffn_down_prefill_1024
    phase: prefill
    M: 1024
    N: 4096
    K: 14336
    source: "flashinfer-trace/gemm_n4096_k14336 (Llama-3.1-8B ffn.down_proj)"

  # 来自 FlashInfer: gemm_n28672_k4096.json (Llama-3.1-8B ffn.up_proj)
  - name: llama31_8b_ffn_up_decode
    phase: decode
    M: 1
    N: 28672
    K: 4096
    source: "flashinfer-trace/gemm_n28672_k4096 (Llama-3.1-8B ffn.up_proj)"

  - name: llama31_8b_ffn_up_prefill_256
    phase: prefill
    M: 256
    N: 28672
    K: 4096
    source: "flashinfer-trace/gemm_n28672_k4096 (Llama-3.1-8B ffn.up_proj)"

  - name: llama31_8b_ffn_up_prefill_1024
    phase: prefill
    M: 1024
    N: 28672
    K: 4096
    source: "flashinfer-trace/gemm_n28672_k4096 (Llama-3.1-8B ffn.up_proj)"

  # 来自 FlashInfer: gemm_n256_k7168.json (DeepSeek-V3)
  - name: deepseek_v3_small_gemm_decode
    phase: decode
    M: 1
    N: 256
    K: 7168
    source: "flashinfer-trace/gemm_n256_k7168 (DeepSeek-V3)"

  - name: deepseek_v3_small_gemm_prefill
    phase: prefill
    M: 256
    N: 256
    K: 7168
    source: "flashinfer-trace/gemm_n256_k7168 (DeepSeek-V3)"
