# MoE Align Block Size 测试用例
# 对应算子列表 #5: MoeAlignBlockSize
# 来源: MoE token routing alignment (Mixtral/DeepSeek MoE)

operator: moe_align_block_size
level: basic
warmup: 10
iters: 100

workloads:
  # ========== Decode Phase ==========
  - name: "mixtral_moe_align_decode_b1"
    num_tokens: 1
    num_experts: 8   # Mixtral-8x7B
    top_k: 2
    block_size: 64
    dtype: bf16
    source: "Mixtral MoE token align, decode, batch=1"
    model: "mistralai/Mixtral-8x7B"
    phase: "decode"

  - name: "mixtral_moe_align_decode_b4"
    num_tokens: 4
    num_experts: 8
    top_k: 2
    block_size: 64
    dtype: bf16
    source: "Mixtral MoE token align, decode, batch=4"
    model: "mistralai/Mixtral-8x7B"
    phase: "decode"

  - name: "deepseek_v3_moe_align_decode_b8"
    num_tokens: 8
    num_experts: 8   # DeepSeek-V3 local experts
    top_k: 8         # DeepSeek-V3 uses top-8
    block_size: 64
    dtype: bf16
    source: "DeepSeek-V3 MoE token align, decode, batch=8"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "decode"

  # ========== Prefill Phase ==========
  - name: "mixtral_moe_align_prefill_s64"
    num_tokens: 64
    num_experts: 8
    top_k: 2
    block_size: 64
    dtype: bf16
    source: "Mixtral MoE token align, prefill, seq=64"
    model: "mistralai/Mixtral-8x7B"
    phase: "prefill"

  - name: "mixtral_moe_align_prefill_s128"
    num_tokens: 128
    num_experts: 8
    top_k: 2
    block_size: 64
    dtype: bf16
    source: "Mixtral MoE token align, prefill, seq=128"
    model: "mistralai/Mixtral-8x7B"
    phase: "prefill"

  - name: "deepseek_v3_moe_align_prefill_s256"
    num_tokens: 256
    num_experts: 8
    top_k: 8
    block_size: 64
    dtype: bf16
    source: "DeepSeek-V3 MoE token align, prefill, seq=256"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "mixtral_moe_align_prefill_s512"
    num_tokens: 512
    num_experts: 8
    top_k: 2
    block_size: 64
    dtype: bf16
    source: "Mixtral MoE token align, prefill, seq=512"
    model: "mistralai/Mixtral-8x7B"
    phase: "prefill"

  - name: "deepseek_v3_moe_align_prefill_s1024"
    num_tokens: 1024
    num_experts: 8
    top_k: 8
    block_size: 64
    dtype: bf16
    source: "DeepSeek-V3 MoE token align, prefill, seq=1024"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "mixtral_moe_align_prefill_s2048"
    num_tokens: 2048
    num_experts: 8
    top_k: 2
    block_size: 64
    dtype: bf16
    source: "Mixtral MoE token align, prefill, seq=2048"
    model: "mistralai/Mixtral-8x7B"
    phase: "prefill"
