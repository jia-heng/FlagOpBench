# SiLU + Mul + Clamp 测试用例
# 对应算子列表 #2: silu_and_mul_with_clamp
# 来源: Gemma-2-9B FFN gating (soft_cap=30.0)

operator: silu_and_mul_with_clamp
level: basic
warmup: 10
iters: 100

workloads:
  # ========== Decode Phase ==========
  - name: "gemma2_9b_gating_decode_b1"
    M: 1
    N: 9216  # Gemma-2-9B intermediate_size / 2
    dtype: bf16
    clamp_min: -30.0
    clamp_max: 30.0
    source: "Gemma-2-9B FFN gating, decode, batch=1"
    model: "google/gemma-2-9b"
    phase: "decode"

  - name: "gemma2_9b_gating_decode_b4"
    M: 4
    N: 9216
    dtype: bf16
    clamp_min: -30.0
    clamp_max: 30.0
    source: "Gemma-2-9B FFN gating, decode, batch=4"
    model: "google/gemma-2-9b"
    phase: "decode"

  - name: "gemma2_9b_gating_decode_b8"
    M: 8
    N: 9216
    dtype: bf16
    clamp_min: -30.0
    clamp_max: 30.0
    source: "Gemma-2-9B FFN gating, decode, batch=8"
    model: "google/gemma-2-9b"
    phase: "decode"

  # ========== Prefill Phase ==========
  - name: "gemma2_9b_gating_prefill_s64"
    M: 64
    N: 9216
    dtype: bf16
    clamp_min: -30.0
    clamp_max: 30.0
    source: "Gemma-2-9B FFN gating, prefill, seq=64"
    model: "google/gemma-2-9b"
    phase: "prefill"

  - name: "gemma2_9b_gating_prefill_s128"
    M: 128
    N: 9216
    dtype: bf16
    clamp_min: -30.0
    clamp_max: 30.0
    source: "Gemma-2-9B FFN gating, prefill, seq=128"
    model: "google/gemma-2-9b"
    phase: "prefill"

  - name: "gemma2_9b_gating_prefill_s256"
    M: 256
    N: 9216
    dtype: bf16
    clamp_min: -30.0
    clamp_max: 30.0
    source: "Gemma-2-9B FFN gating, prefill, seq=256"
    model: "google/gemma-2-9b"
    phase: "prefill"

  - name: "gemma2_9b_gating_prefill_s512"
    M: 512
    N: 9216
    dtype: bf16
    clamp_min: -30.0
    clamp_max: 30.0
    source: "Gemma-2-9B FFN gating, prefill, seq=512"
    model: "google/gemma-2-9b"
    phase: "prefill"

  - name: "gemma2_9b_gating_prefill_s1024"
    M: 1024
    N: 9216
    dtype: bf16
    clamp_min: -30.0
    clamp_max: 30.0
    source: "Gemma-2-9B FFN gating, prefill, seq=1024"
    model: "google/gemma-2-9b"
    phase: "prefill"

  - name: "gemma2_9b_gating_prefill_s2048"
    M: 2048
    N: 9216
    dtype: bf16
    clamp_min: -30.0
    clamp_max: 30.0
    source: "Gemma-2-9B FFN gating, prefill, seq=2048"
    model: "google/gemma-2-9b"
    phase: "prefill"
