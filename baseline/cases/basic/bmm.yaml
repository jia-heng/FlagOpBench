operator: bmm
description: "Batch Matrix Multiply - FlashInfer Real Workloads"

definition:
  const_axes:
    dtype: "bf16"
  var_axes:
    batch: [1, 8, 32, 128]
    M: [1, 128, 512, 1024, 2048, 4096]
    K: [128]
    N: [128, 512, 1024, 2048, 4096]

workloads:
  # 来自 FlashInfer GEMM shapes，转换为 BMM (Attention Q@K^T, Attn@V)
  # Llama-3.1-8B: 32 heads, head_dim=128
  - name: llama31_8b_attn_qk_decode
    phase: decode
    batch: 32
    M: 1
    K: 128
    N: 1024
    source: "Llama-3.1-8B attention Q@K^T decode (seq=1, kv_len=1024)"

  - name: llama31_8b_attn_qk_prefill_128
    phase: prefill
    batch: 32
    M: 128
    K: 128
    N: 128
    source: "Llama-3.1-8B attention Q@K^T prefill (seq=128)"

  - name: llama31_8b_attn_qk_prefill_512
    phase: prefill
    batch: 32
    M: 512
    K: 128
    N: 512
    source: "Llama-3.1-8B attention Q@K^T prefill (seq=512)"

  - name: llama31_8b_attn_qk_prefill_1024
    phase: prefill
    batch: 32
    M: 1024
    K: 128
    N: 1024
    source: "Llama-3.1-8B attention Q@K^T prefill (seq=1024)"

  - name: llama31_8b_attn_av_decode
    phase: decode
    batch: 32
    M: 1
    K: 1024
    N: 128
    source: "Llama-3.1-8B attention Attn@V decode (seq=1, kv_len=1024)"

  - name: llama31_8b_attn_av_prefill_512
    phase: prefill
    batch: 32
    M: 512
    K: 512
    N: 128
    source: "Llama-3.1-8B attention Attn@V prefill (seq=512)"

  # DeepSeek-V3: 128 heads, head_dim=128
  - name: deepseek_v3_attn_qk_decode
    phase: decode
    batch: 128
    M: 1
    K: 128
    N: 1024
    source: "DeepSeek-V3 attention Q@K^T decode (128 heads, seq=1, kv_len=1024)"

  - name: deepseek_v3_attn_qk_prefill_512
    phase: prefill
    batch: 128
    M: 512
    K: 128
    N: 512
    source: "DeepSeek-V3 attention Q@K^T prefill (128 heads, seq=512)"

  - name: deepseek_v3_attn_qk_prefill_2048
    phase: prefill
    batch: 128
    M: 2048
    K: 128
    N: 2048
    source: "DeepSeek-V3 attention Q@K^T prefill (128 heads, seq=2048)"

  - name: deepseek_v3_attn_av_decode
    phase: decode
    batch: 128
    M: 1
    K: 1024
    N: 128
    source: "DeepSeek-V3 attention Attn@V decode (128 heads, seq=1, kv_len=1024)"

  - name: deepseek_v3_attn_av_prefill_2048
    phase: prefill
    batch: 128
    M: 2048
    K: 2048
    N: 128
    source: "DeepSeek-V3 attention Attn@V prefill (128 heads, seq=2048)"
