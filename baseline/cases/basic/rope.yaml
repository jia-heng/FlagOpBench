# RoPE 测试用例
# 对应算子列表 #51
operator: rope
level: basic
warmup: 10
iters: 100
scenarios:
  # DeepSeek-V3: 128 heads, head_dim=192 (128+64 for rope)
  - name: "deepseek_v3_rope_prefill"
    batch: 1
    seq_len: 2048
    num_heads: 128
    head_dim: 192
    dtype: bf16

  - name: "deepseek_v3_rope_decode"
    batch: 1
    seq_len: 1
    num_heads: 128
    head_dim: 192
    dtype: bf16

  - name: "deepseek_v3_rope_batch8"
    batch: 8
    seq_len: 1024
    num_heads: 128
    head_dim: 192
    dtype: bf16

  # LLaMA: 32 heads, head_dim=128
  - name: "llama_rope_prefill"
    batch: 1
    seq_len: 2048
    num_heads: 32
    head_dim: 128
    dtype: bf16

  - name: "llama_rope_decode"
    batch: 1
    seq_len: 1
    num_heads: 32
    head_dim: 128
    dtype: bf16
