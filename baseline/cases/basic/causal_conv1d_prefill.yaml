# Causal Conv1D Prefill 测试用例
# 对应算子列表 #22: CausalConv1DPrefill
# 来源: Mamba architecture (state space model convolution)

operator: causal_conv1d_prefill
level: basic
warmup: 10
iters: 100

workloads:
  # ========== Small Batch ==========
  - name: "mamba_conv1d_prefill_b1_s64"
    batch: 1
    hidden_size: 2560  # Mamba-2.8B d_model
    seq_len: 64
    kernel_size: 4
    dtype: bf16
    source: "Mamba-2.8B conv1d, prefill, batch=1, seq=64"
    model: "state-spaces/mamba-2.8b"
    phase: "prefill"

  - name: "mamba_conv1d_prefill_b1_s128"
    batch: 1
    hidden_size: 2560
    seq_len: 128
    kernel_size: 4
    dtype: bf16
    source: "Mamba-2.8B conv1d, prefill, batch=1, seq=128"
    model: "state-spaces/mamba-2.8b"
    phase: "prefill"

  - name: "mamba_conv1d_prefill_b1_s256"
    batch: 1
    hidden_size: 2560
    seq_len: 256
    kernel_size: 4
    dtype: bf16
    source: "Mamba-2.8B conv1d, prefill, batch=1, seq=256"
    model: "state-spaces/mamba-2.8b"
    phase: "prefill"

  # ========== Medium Batch ==========
  - name: "mamba_conv1d_prefill_b4_s512"
    batch: 4
    hidden_size: 2560
    seq_len: 512
    kernel_size: 4
    dtype: bf16
    source: "Mamba-2.8B conv1d, prefill, batch=4, seq=512"
    model: "state-spaces/mamba-2.8b"
    phase: "prefill"

  - name: "mamba_conv1d_prefill_b4_s1024"
    batch: 4
    hidden_size: 2560
    seq_len: 1024
    kernel_size: 4
    dtype: bf16
    source: "Mamba-2.8B conv1d, prefill, batch=4, seq=1024"
    model: "state-spaces/mamba-2.8b"
    phase: "prefill"

  # ========== Large Sequence ==========
  - name: "mamba_conv1d_prefill_b1_s2048"
    batch: 1
    hidden_size: 2560
    seq_len: 2048
    kernel_size: 4
    dtype: bf16
    source: "Mamba-2.8B conv1d, prefill, batch=1, seq=2048"
    model: "state-spaces/mamba-2.8b"
    phase: "prefill"

  - name: "mamba_conv1d_prefill_b1_s4096"
    batch: 1
    hidden_size: 2560
    seq_len: 4096
    kernel_size: 4
    dtype: bf16
    source: "Mamba-2.8B conv1d, prefill, batch=1, seq=4096"
    model: "state-spaces/mamba-2.8b"
    phase: "prefill"

  # ========== Large Batch ==========
  - name: "mamba_conv1d_prefill_b8_s512"
    batch: 8
    hidden_size: 2560
    seq_len: 512
    kernel_size: 4
    dtype: bf16
    source: "Mamba-2.8B conv1d, prefill, batch=8, seq=512"
    model: "state-spaces/mamba-2.8b"
    phase: "prefill"

  - name: "mamba_conv1d_prefill_b8_s1024"
    batch: 8
    hidden_size: 2560
    seq_len: 1024
    kernel_size: 4
    dtype: bf16
    source: "Mamba-2.8B conv1d, prefill, batch=8, seq=1024"
    model: "state-spaces/mamba-2.8b"
    phase: "prefill"
