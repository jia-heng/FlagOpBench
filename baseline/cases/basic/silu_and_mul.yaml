# SiLU and Mul 测试用例
# 对应算子列表 #2: silu_and_mul_with_clamp
operator: silu_and_mul
level: basic
warmup: 10
iters: 100
scenarios:
  - name: "ffn_gate_seq2048"
    M: 2048
    N: 18432
    dtype: bf16

  - name: "ffn_gate_seq4096"
    M: 4096
    N: 18432
    dtype: bf16

  - name: "ffn_gate_decode"
    M: 1
    N: 18432
    dtype: bf16

  - name: "ffn_gate_batch128"
    M: 128
    N: 18432
    dtype: bf16

  - name: "ffn_gate_with_clamp"
    M: 2048
    N: 18432
    dtype: bf16
    clamp_value: 10.0
