# 矩阵乘法 (mm) 测试用例
# Shape 来源: DeepSeek-V3 模型配置
operator: mm
level: basic
warmup: 10
iters: 100
scenarios:
  # FFN up projection: hidden -> intermediate
  - name: "deepseek_v3_ffn_up"
    M: 2048
    K: 7168
    N: 18432
    dtype: bf16

  # FFN down projection: intermediate -> hidden
  - name: "deepseek_v3_ffn_down"
    M: 2048
    K: 18432
    N: 7168
    dtype: bf16

  # Attention QKV projection
  - name: "deepseek_v3_qkv_proj"
    M: 2048
    K: 7168
    N: 1536
    dtype: bf16

  # Output projection
  - name: "deepseek_v3_o_proj"
    M: 2048
    K: 16384
    N: 7168
    dtype: bf16

  # Small batch (decode)
  - name: "deepseek_v3_decode_ffn_up"
    M: 1
    K: 7168
    N: 18432
    dtype: bf16

  # Medium batch
  - name: "deepseek_v3_batch128_ffn_up"
    M: 128
    K: 7168
    N: 18432
    dtype: bf16

  # Large batch (prefill)
  - name: "deepseek_v3_prefill4096_ffn_up"
    M: 4096
    K: 7168
    N: 18432
    dtype: bf16

  # fp16 对比
  - name: "deepseek_v3_ffn_up_fp16"
    M: 2048
    K: 7168
    N: 18432
    dtype: fp16
