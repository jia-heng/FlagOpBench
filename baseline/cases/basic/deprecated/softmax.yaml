# Softmax 测试用例
operator: softmax
level: basic
warmup: 10
iters: 100
scenarios:
  - name: "attention_seq2048"
    M: 2048
    N: 2048
    dtype: bf16

  - name: "attention_seq4096"
    M: 4096
    N: 4096
    dtype: bf16

  - name: "attention_decode_kv4096"
    M: 1
    N: 4096
    dtype: bf16

  - name: "vocab_logits"
    M: 2048
    N: 129280
    dtype: bf16

  - name: "attention_seq512"
    M: 512
    N: 512
    dtype: bf16

  - name: "attention_seq2048_fp16"
    M: 2048
    N: 2048
    dtype: fp16
