# 批矩阵乘法 (bmm) 测试用例
# Shape 来源: DeepSeek-V3 attention
operator: bmm
level: basic
warmup: 10
iters: 100
scenarios:
  # Attention score: Q @ K^T
  - name: "attention_score_128heads_seq2048"
    batch: 128
    M: 2048
    K: 128
    N: 2048
    dtype: bf16

  # Attention output: attn_weights @ V
  - name: "attention_output_128heads_seq2048"
    batch: 128
    M: 2048
    K: 2048
    N: 128
    dtype: bf16

  # Decode: single token attention
  - name: "attention_score_128heads_decode"
    batch: 128
    M: 1
    K: 128
    N: 4096
    dtype: bf16

  # Small seq length
  - name: "attention_score_128heads_seq512"
    batch: 128
    M: 512
    K: 128
    N: 512
    dtype: bf16
