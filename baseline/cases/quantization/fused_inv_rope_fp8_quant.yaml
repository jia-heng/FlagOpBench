# Fused Inverse RoPE + FP8 Quantization 测试用例
# 对应算子列表: fused_inv_rope_fp8_quant
# 来源: DeepSeek-V3 KV cache preprocessing (inverse RoPE + quantization)

operator: fused_inv_rope_fp8_quant
level: quantization
warmup: 10
iters: 100

workloads:
  # ========== Decode Phase ==========
  - name: "deepseek_v3_inv_rope_decode_b1"
    num_tokens: 1
    num_heads: 128  # DeepSeek-V3 KV heads
    head_dim: 128
    dtype: bf16
    source: "DeepSeek-V3 inverse RoPE + FP8, decode, batch=1"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "decode"

  - name: "deepseek_v3_inv_rope_decode_b4"
    num_tokens: 4
    num_heads: 128
    head_dim: 128
    dtype: bf16
    source: "DeepSeek-V3 inverse RoPE + FP8, decode, batch=4"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "decode"

  - name: "llama31_8b_inv_rope_decode_b8"
    num_tokens: 8
    num_heads: 8  # Llama-3.1-8B KV heads
    head_dim: 128
    dtype: bf16
    source: "Llama-3.1-8B inverse RoPE + FP8, decode, batch=8"
    model: "meta-llama/Llama-3.1-8B"
    phase: "decode"

  # ========== Prefill Phase ==========
  - name: "deepseek_v3_inv_rope_prefill_s64"
    num_tokens: 64
    num_heads: 128
    head_dim: 128
    dtype: bf16
    source: "DeepSeek-V3 inverse RoPE + FP8, prefill, seq=64"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "deepseek_v3_inv_rope_prefill_s128"
    num_tokens: 128
    num_heads: 128
    head_dim: 128
    dtype: bf16
    source: "DeepSeek-V3 inverse RoPE + FP8, prefill, seq=128"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "deepseek_v3_inv_rope_prefill_s256"
    num_tokens: 256
    num_heads: 128
    head_dim: 128
    dtype: bf16
    source: "DeepSeek-V3 inverse RoPE + FP8, prefill, seq=256"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "llama31_8b_inv_rope_prefill_s512"
    num_tokens: 512
    num_heads: 8
    head_dim: 128
    dtype: bf16
    source: "Llama-3.1-8B inverse RoPE + FP8, prefill, seq=512"
    model: "meta-llama/Llama-3.1-8B"
    phase: "prefill"

  - name: "deepseek_v3_inv_rope_prefill_s1024"
    num_tokens: 1024
    num_heads: 128
    head_dim: 128
    dtype: bf16
    source: "DeepSeek-V3 inverse RoPE + FP8, prefill, seq=1024"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "deepseek_v3_inv_rope_prefill_s2048"
    num_tokens: 2048
    num_heads: 128
    head_dim: 128
    dtype: bf16
    source: "DeepSeek-V3 inverse RoPE + FP8, prefill, seq=2048"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"
