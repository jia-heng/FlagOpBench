# Fused Marlin MoE 测试用例
# 对应算子列表 #24: fused_marlin_moe
# 来源: DeepSeek-V3 INT4/INT8 quantized MoE (当前测试 BF16 baseline)

operator: fused_marlin_moe
level: quantization
warmup: 10
iters: 50

const_axes:
  num_experts: 8        # Reduced for testing (real: 32 local, 256 total)
  hidden_size: 2048     # Reduced from 7168 for feasible testing
  expert_size: 512      # Reduced from 2048 (was intermediate_size)
  top_k: 2              # Reduced from 8 for faster testing
  dtype: bf16

workloads:
  # ========== Decode Phase ==========
  - name: "deepseek_v3_marlin_moe_decode_b1"
    num_tokens: 1
    source: "DeepSeek-V3 Marlin MoE, decode, batch=1"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "decode"

  - name: "deepseek_v3_marlin_moe_decode_b4"
    num_tokens: 4
    source: "DeepSeek-V3 Marlin MoE, decode, batch=4"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "decode"

  - name: "deepseek_v3_marlin_moe_decode_b8"
    num_tokens: 8
    source: "DeepSeek-V3 Marlin MoE, decode, batch=8"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "decode"

  - name: "deepseek_v3_marlin_moe_decode_b16"
    num_tokens: 16
    source: "DeepSeek-V3 Marlin MoE, decode, batch=16"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "decode"

  - name: "deepseek_v3_marlin_moe_decode_b32"
    num_tokens: 32
    source: "DeepSeek-V3 Marlin MoE, decode, batch=32"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "decode"

  # ========== Prefill Phase ==========
  - name: "deepseek_v3_marlin_moe_prefill_s64"
    num_tokens: 64
    source: "DeepSeek-V3 Marlin MoE, prefill, seq=64"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "deepseek_v3_marlin_moe_prefill_s128"
    num_tokens: 128
    source: "DeepSeek-V3 Marlin MoE, prefill, seq=128"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "deepseek_v3_marlin_moe_prefill_s256"
    num_tokens: 256
    source: "DeepSeek-V3 Marlin MoE, prefill, seq=256"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "deepseek_v3_marlin_moe_prefill_s512"
    num_tokens: 512
    source: "DeepSeek-V3 Marlin MoE, prefill, seq=512"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "deepseek_v3_marlin_moe_prefill_s1024"
    num_tokens: 1024
    source: "DeepSeek-V3 Marlin MoE, prefill, seq=1024"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "deepseek_v3_marlin_moe_prefill_s2048"
    num_tokens: 2048
    source: "DeepSeek-V3 Marlin MoE, prefill, seq=2048"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "deepseek_v3_marlin_moe_prefill_s4096"
    num_tokens: 4096
    source: "DeepSeek-V3 Marlin MoE, prefill, seq=4096"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"
