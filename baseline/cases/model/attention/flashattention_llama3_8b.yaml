# Flash Attention 测试用例 - Llama-3.1-8B
operator: flashattention
level: model
warmup: 5
iters: 50
scenarios:
  # Decode 场景 (seq_len = 1)
  - name: decode_b1_s1
    batch: 1
    seq_len: 1
    num_heads: 32
    head_dim: 128
    dtype: bf16
    causal: true

  - name: decode_b8_s1
    batch: 8
    seq_len: 1
    num_heads: 32
    head_dim: 128
    dtype: bf16
    causal: true

  - name: decode_b16_s1
    batch: 16
    seq_len: 1
    num_heads: 32
    head_dim: 128
    dtype: bf16
    causal: true

  # Small prefill
  - name: prefill_b1_s128
    batch: 1
    seq_len: 128
    num_heads: 32
    head_dim: 128
    dtype: bf16
    causal: true

  - name: prefill_b1_s512
    batch: 1
    seq_len: 512
    num_heads: 32
    head_dim: 128
    dtype: bf16
    causal: true

  - name: prefill_b1_s1024
    batch: 1
    seq_len: 1024
    num_heads: 32
    head_dim: 128
    dtype: bf16
    causal: true

  - name: prefill_b1_s2048
    batch: 1
    seq_len: 2048
    num_heads: 32
    head_dim: 128
    dtype: bf16
    causal: true

  - name: prefill_b1_s4096
    batch: 1
    seq_len: 4096
    num_heads: 32
    head_dim: 128
    dtype: bf16
    causal: true
