operator: sparse_attention
backend: nvidia
platform: nvidia_h20

# Sparse Attention 测试用例
# 基于 Llama-3.1-8B attention shape (32 heads, head_dim=128)

warmup: 10
iters: 100

scenarios:
  # Decode phase - small batch
  - name: decode_b1_s1_h32_d128
    batch_size: 1
    seq_len: 1
    num_heads: 32
    head_dim: 128
    causal: true
    dtype: bf16

  - name: decode_b8_s1_h32_d128
    batch_size: 8
    seq_len: 1
    num_heads: 32
    head_dim: 128
    causal: true
    dtype: bf16

  # Prefill phase - longer sequences
  - name: prefill_b1_s512_h32_d128
    batch_size: 1
    seq_len: 512
    num_heads: 32
    head_dim: 128
    causal: true
    dtype: bf16

  - name: prefill_b1_s1024_h32_d128
    batch_size: 1
    seq_len: 1024
    num_heads: 32
    head_dim: 128
    causal: true
    dtype: bf16

  - name: prefill_b1_s2048_h32_d128
    batch_size: 1
    seq_len: 2048
    num_heads: 32
    head_dim: 128
    causal: true
    dtype: bf16

  # Mixed batch
  - name: mixed_b4_s256_h32_d128
    batch_size: 4
    seq_len: 256
    num_heads: 32
    head_dim: 128
    causal: true
    dtype: bf16
