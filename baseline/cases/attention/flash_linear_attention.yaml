operator: flash_linear_attention
description: "Flash Linear Attention - Gated Delta Rule (GLA/Falcon-H1), vLLM Triton kernel"

const_axes:
  num_heads: 16
  head_dim: 64
  dtype: bf16

warmup: 5
iters: 50

workloads:
  # ===== Small (Decode) =====
  - name: gla_decode_b1
    batch: 1
    seq_len: 1
    phase: decode
    source: "GLA model decode, single token, fused_recurrent kernel"

  - name: gla_decode_b4
    batch: 4
    seq_len: 1
    phase: decode
    source: "GLA model decode, batch=4, fused_recurrent kernel"

  - name: gla_decode_b8
    batch: 8
    seq_len: 1
    phase: decode
    source: "GLA model decode, batch=8, fused_recurrent kernel"

  # ===== Medium (Short Prefill) =====
  - name: gla_prefill_s128
    batch: 1
    seq_len: 128
    phase: prefill
    source: "GLA model prefill, chunk kernel"

  - name: gla_prefill_s512
    batch: 1
    seq_len: 512
    phase: prefill
    source: "GLA model prefill, chunk kernel"

  - name: gla_prefill_s1024
    batch: 1
    seq_len: 1024
    phase: prefill
    source: "GLA model prefill, chunk kernel"

  # ===== Large (Long Prefill) =====
  - name: gla_prefill_s2048
    batch: 1
    seq_len: 2048
    phase: prefill
    source: "GLA model prefill, chunk kernel, 2K context"

  - name: gla_prefill_s4096
    batch: 1
    seq_len: 4096
    phase: prefill
    source: "GLA model prefill, chunk kernel, 4K context"

  - name: gla_prefill_s8192
    batch: 1
    seq_len: 8192
    phase: prefill
    source: "GLA model prefill, chunk kernel, 8K context"
