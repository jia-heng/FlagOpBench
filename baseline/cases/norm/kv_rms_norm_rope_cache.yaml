# KV RMSNorm + RoPE + Cache 测试用例
# 对应算子列表: kv_rms_norm_rope_cache
# 来源: Llama-3.1 fused KV processing (RMSNorm + RoPE + Cache write)

operator: kv_rms_norm_rope_cache
level: norm
warmup: 10
iters: 100

workloads:
  # ========== Decode Phase ==========
  - name: "llama31_8b_kv_cache_decode_b1_c1024"
    num_tokens: 1
    num_kv_heads: 8   # Llama-3.1-8B KV heads
    head_dim: 128
    cache_len: 1024
    dtype: bf16
    eps: 1e-6
    source: "Llama-3.1-8B KV cache, decode, batch=1, cache=1024"
    model: "meta-llama/Llama-3.1-8B"
    phase: "decode"

  - name: "llama31_8b_kv_cache_decode_b4_c2048"
    num_tokens: 4
    num_kv_heads: 8
    head_dim: 128
    cache_len: 2048
    dtype: bf16
    eps: 1e-6
    source: "Llama-3.1-8B KV cache, decode, batch=4, cache=2048"
    model: "meta-llama/Llama-3.1-8B"
    phase: "decode"

  - name: "deepseek_v3_kv_cache_decode_b8_c1024"
    num_tokens: 8
    num_kv_heads: 128  # DeepSeek-V3 KV heads
    head_dim: 128
    cache_len: 1024
    dtype: bf16
    eps: 1e-6
    source: "DeepSeek-V3 KV cache, decode, batch=8, cache=1024"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "decode"

  # ========== Prefill Phase ==========
  - name: "llama31_8b_kv_cache_prefill_s64_c128"
    num_tokens: 64
    num_kv_heads: 8
    head_dim: 128
    cache_len: 128
    dtype: bf16
    eps: 1e-6
    source: "Llama-3.1-8B KV cache, prefill, seq=64, cache=128"
    model: "meta-llama/Llama-3.1-8B"
    phase: "prefill"

  - name: "llama31_8b_kv_cache_prefill_s128_c512"
    num_tokens: 128
    num_kv_heads: 8
    head_dim: 128
    cache_len: 512
    dtype: bf16
    eps: 1e-6
    source: "Llama-3.1-8B KV cache, prefill, seq=128, cache=512"
    model: "meta-llama/Llama-3.1-8B"
    phase: "prefill"

  - name: "deepseek_v3_kv_cache_prefill_s256_c1024"
    num_tokens: 256
    num_kv_heads: 128
    head_dim: 128
    cache_len: 1024
    dtype: bf16
    eps: 1e-6
    source: "DeepSeek-V3 KV cache, prefill, seq=256, cache=1024"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "llama31_8b_kv_cache_prefill_s512_c2048"
    num_tokens: 512
    num_kv_heads: 8
    head_dim: 128
    cache_len: 2048
    dtype: bf16
    eps: 1e-6
    source: "Llama-3.1-8B KV cache, prefill, seq=512, cache=2048"
    model: "meta-llama/Llama-3.1-8B"
    phase: "prefill"

  - name: "deepseek_v3_kv_cache_prefill_s1024_c4096"
    num_tokens: 1024
    num_kv_heads: 128
    head_dim: 128
    cache_len: 4096
    dtype: bf16
    eps: 1e-6
    source: "DeepSeek-V3 KV cache, prefill, seq=1024, cache=4096"
    model: "deepseek-ai/DeepSeek-V3"
    phase: "prefill"

  - name: "llama31_8b_kv_cache_prefill_s2048_c4096"
    num_tokens: 2048
    num_kv_heads: 8
    head_dim: 128
    cache_len: 4096
    dtype: bf16
    eps: 1e-6
    source: "Llama-3.1-8B KV cache, prefill, seq=2048, cache=4096"
    model: "meta-llama/Llama-3.1-8B"
    phase: "prefill"
