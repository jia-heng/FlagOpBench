# 算子注册表 — casegen 和 benchmark 框架的单一数据源
# 每实现一个算子就新增一条记录
#
# 字段说明:
#   name: 算子名 (对应 case YAML 中的 operator 字段)
#   library: flaggems_vllm | flag_gems | flag_attention
#   status: implemented | planned
#   param_mapping: 参数映射规则 (casegen 使用)
#     const_axes_rule: 从模型参数推导固定轴的规则名
#     var_axes_key: 部署场景中变化轴的 key
#     applicable: 适用条件

